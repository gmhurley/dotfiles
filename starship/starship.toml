"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$line_break\
$character"""

right_format = "$time"

[os]
disabled = false
style = "bold white"


[os.symbols]
Macos = " "

[hostname]
ssh_only = true
format = "at [$hostname]($style) "
style = "bold yellow"

[directory]
truncation_length = 100
truncate_to_repo = false
style = "bold blue"
read_only = "  "

[git_branch]
symbol = " "
format = "on [$symbol$branch]($style) "
style = "bold green"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold yellow"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"
stashed = ""

[python]
symbol = " "
format = '[(\($virtualenv\) )]($style)[$symbol$version]($style) '
style = "bold yellow"

[aws]
disabled = true

[time]
disabled = false
format = "[$time]($style)"
time_format = "%H:%M:%S"
style = "bold white"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
